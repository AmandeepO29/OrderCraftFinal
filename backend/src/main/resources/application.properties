spring.application.name=OrderCraft-OMS

# Default Server Port
server.port=8080

# Active Profile: dev (H2) or prod (MySQL)
spring.profiles.active=dev

# Disable automatic SQL script initialization (Hibernate ddl-auto and DataInitializer handle schema and seed data)
spring.sql.init.mode=never

# File upload limits if needed
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
